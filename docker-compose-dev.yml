services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_impa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_impa
      POSTGRES_PASSWORD: crm_impa_2026
      POSTGRES_DB: crm_impa_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_impa -d crm_impa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crm_impa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: crm_impa_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  docling:
    build:
      context: ./docling-service
      dockerfile: Dockerfile
    container_name: crm_impa_docling
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WORKERS: 2
      MAX_FILE_SIZE_MB: 100
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
