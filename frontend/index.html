<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>IMPA CRM</title>
  </head>
  <body>
    <!-- Facebook SDK root element -->
    <div id="fb-root"></div>

    <!-- Facebook SDK - loaded asynchronously -->
    <script>
      // Facebook SDK will be initialized by React after loading env vars
      window.fbAsyncInit = function() {
        // FB.init will be called from useFacebookSDK hook
        console.log('[FB SDK] Loaded and ready for initialization');
      };
    </script>
    <script async defer crossorigin="anonymous"
      src="https://connect.facebook.net/pt_BR/sdk.js">
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
